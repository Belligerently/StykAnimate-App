[package]
name = "styk-render"
description = "GPU renderer for StykAnimate draw lists (wgpu: WebGPU, WebGL2, Vulkan, Metal, DX12)."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
styk-draw = { path = "../styk-draw" }
styk-eval = { path = "../styk-eval" }
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30"

# In a browser: WebGPU where it exists, WebGL2 otherwise.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
