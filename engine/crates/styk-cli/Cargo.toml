[package]
name = "styk-cli"
description = "Headless tools: decode, evaluate, benchmark and compare against the JavaScript reference."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "styk"
path = "src/main.rs"

[dependencies]
styk-eval = { path = "../styk-eval" }
styk-doc = { path = "../styk-doc" }
styk-formats = { path = "../styk-formats" }
rayon = "1"
styk-render = { path = "../styk-render" }
styk-raster = { path = "../styk-raster" }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
